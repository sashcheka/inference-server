name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DINFERENCE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
